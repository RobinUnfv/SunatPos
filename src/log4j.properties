# ??????????????????????????????????????????????????????????????????????????????
# LOG4J CONFIGURATION - SysCoreFacturacion
# ??????????????????????????????????????????????????????????????????????????????
# Ubicar este archivo en: src/main/resources/log4j.properties
# O en la raíz del classpath del proyecto
# ??????????????????????????????????????????????????????????????????????????????

# Root logger - nivel INFO, salida a consola y archivo
log4j.rootLogger=INFO, console, file

# ??????????????????????????????????????????????????????????????????????????????
# APPENDER: CONSOLA
# ??????????????????????????????????????????????????????????????????????????????
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{1}] - %m%n

# ??????????????????????????????????????????????????????????????????????????????
# APPENDER: ARCHIVO
# ??????????????????????????????????????????????????????????????????????????????
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/syscore_facturacion.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=5
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{1}] - %m%n

# ??????????????????????????????????????????????????????????????????????????????
# NIVELES POR PAQUETE
# ??????????????????????????????????????????????????????????????????????????????

# Paquetes del proyecto - nivel DEBUG para desarrollo
log4j.logger.Modelo=DEBUG
log4j.logger.factory=DEBUG
log4j.logger.Modelo.Dispatchers=DEBUG
log4j.logger.Modelo.Util=DEBUG

# Apache XML Security - reducir verbosidad
log4j.logger.org.apache.xml.security=WARN

# Apache HTTP Client
log4j.logger.org.apache.http=WARN

# Otros paquetes externos
log4j.logger.org.apache=WARN
log4j.logger.org.quartz=INFO